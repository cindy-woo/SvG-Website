name: Deploy to GitHub Pages

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5

    - uses: actions/setup-node@v5
      with:
        node-version: 22.x
        cache: npm

    - uses: actions/setup-python@v6
      with:
        python-version: "3.11"

    # A project site lives at https://<owner>.github.io/<repo>/; a repo named
    # <owner>.github.io lives at the root. Derive the path so a renamed or
    # copied repository deploys at its own address.
    - name: Work out where GitHub Pages serves this repository
      id: site
      run: |
        owner="${GITHUB_REPOSITORY_OWNER,,}"
        name="${GITHUB_REPOSITORY#*/}"
        if [ "${name,,}" = "$owner.github.io" ]; then base="/"; else base="/$name/"; fi
        echo "base=$base" >> "$GITHUB_OUTPUT"
        echo "url=https://$owner.github.io$base" >> "$GITHUB_OUTPUT"
        echo "Site: https://$owner.github.io$base"

    - name: Build homepage
      run: |
        npm ci
        npm run build -- --base="${{ steps.site.outputs.base }}"
        node scripts/verify-build.mjs

    - name: Build docs
      run: |
        sed -i "s|https://cindy-woo.github.io/svg-website/|${{ steps.site.outputs.url }}|g" mkdocs.yml docs/index.md
        pip install "zensical==0.0.58"
        zensical build --strict
        rm -rf dist/docs && mv site dist/docs

    - uses: actions/upload-pages-artifact@v4
      with:
        path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - id: deployment
      uses: actions/deploy-pages@v4
